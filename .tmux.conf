# tmux configuration for public-devpod: session persistence across detaches.
set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"

# Plugins (tpm is cloned to ~/.tmux/plugins/tpm by .devcontainer/install-tools.sh)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim less tail top htop watch needle'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep this line last
if-shell 'test -d ~/.tmux/plugins/tpm' 'run ~/.tmux/plugins/tpm/tpm'
